<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKYGROUP — Девелопер полного цикла</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EAE6DF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
    html, body { margin: 0; padding: 0; background-color: #EAE6DF; }

    /* Основной фон за пределами карточки */
    .sg-link-tree-wrapper {
        min-height: 100vh;
        background-color: #EAE6DF;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 15px;
        font-family: 'Montserrat', sans-serif;
        box-sizing: border-box;
    }

    /* Мобильный контейнер */
    .sg-container {
        width: 100%;
        max-width: 440px;
        background: #F4F1EA; /* Кремовый цвет шоппера */
        border-radius: 32px;
        padding: 45px 0 0 0;
        box-shadow: 0 24px 48px rgba(23, 42, 64, 0.12);
        text-align: center;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Декоративное "Солнце" в правом верхнем углу */
    .sg-top-accent {
        position: absolute;
        top: -25px;
        right: -25px;
        width: 90px;
        height: 90px;
        background-color: #EA5C2B;
        border-radius: 50%;
        opacity: 0.9;
        z-index: 0;
    }

    /* Верхняя светлая часть */
    .sg-top-section {
        padding: 45px 20px 0 20px;
        position: relative;
        z-index: 1;
    }

    /* Логотип */
    .sg-avatar { margin-bottom: 25px; }
    .sg-avatar img { width: 170px; height: auto; object-fit: contain; }

    /* === Заголовки === */
    .sg-title-block {
        margin-bottom: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .sg-name {
        font-size: 26px;
        font-weight: 900;
        color: #172A40;
        margin: 0 0 4px 0;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .sg-handle-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .sg-handle {
        font-size: 12px;
        font-weight: 600;
        color: #EA5C2B;
        margin: 0;
        letter-spacing: 3px;
        text-transform: lowercase;
    }

    /* Линия у подзаголовка */
    .sg-handle-line {
        width: 20px;
        height: 2px;
        background-color: #172A40;
        border-radius: 2px;
        opacity: 0.3;
    }

    /* Заголовки разделов */
    .sg-section-title {
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
        color: #172A40;
        margin: 0 0 14px 12px;
        text-align: left;
        letter-spacing: 1.5px;
        opacity: 0.9;
    }

    .sg-links-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* === Светлые Карточки === */
    .sg-card {
        background-color: #FFFFFF;
        border: 1px solid rgba(23, 42, 64, 0.05);
        border-radius: 18px;
        padding: 12px 14px;
        text-decoration: none;
        display: flex;
        align-items: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(23, 42, 64, 0.03);
    }

    .sg-card:active, .sg-card:hover {
        transform: scale(0.98);
        border-color: #172A40;
        box-shadow: 0 8px 20px rgba(23, 42, 64, 0.06);
    }

    .sg-card-img {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background-color: #F4F1EA;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        overflow: hidden;
    }

    .sg-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .sg-card-text { margin-left: 14px; text-align: left; flex-grow: 1; }

    .sg-card-title {
        font-size: 13px;
        font-weight: 700;
        color: #172A40;
        line-height: 1.3;
    }

    .sg-card-subtitle {
        font-size: 11px;
        font-weight: 500;
        color: #8C98A4;
        margin-top: 2px;
    }

    .sg-card-arrow {
        color: #EA5C2B;
        font-size: 20px;
        margin-left: 8px;
        font-weight: 500;
        transition: transform 0.3s ease, color 0.3s ease;
    }

    .sg-card:hover .sg-card-arrow, .sg-card:active .sg-card-arrow {
        transform: translateX(4px);
        color: #172A40;
    }

    /* === ГРАФИЧЕСКИЙ ПЕРЕХОД === */
    .sg-transition-art {
        width: 100%;
        margin-top: 25px;
        margin-bottom: -1px;
        line-height: 0;
    }

    /* === ТЕМНО-СИНЯЯ НИЖНЯЯ ЧАСТЬ === */
    .sg-bottom-section {
        background-color: #172A40;
        padding: 15px 20px 35px 20px;
        flex-grow: 1;
    }

    .sg-bottom-section .sg-section-title {
        color: #F4F1EA;
        opacity: 0.9;
        margin-bottom: 16px;
    }

    /* Темные карточки для нижней зоны */
    .sg-bottom-section .sg-card {
        background-color: rgba(244, 241, 234, 0.05);
        border: 1px solid rgba(244, 241, 234, 0.1);
        box-shadow: none;
    }

    .sg-bottom-section .sg-card:active, .sg-bottom-section .sg-card:hover {
        background-color: rgba(244, 241, 234, 0.12);
        border-color: #EA5C2B;
    }

    .sg-bottom-section .sg-card-img { background-color: rgba(255, 255, 255, 0.1); }
    .sg-bottom-section .sg-card-title { color: #FFFFFF; }
    .sg-bottom-section .sg-card-subtitle { color: rgba(244, 241, 234, 0.5); }
    .sg-bottom-section .sg-card-arrow { color: #F4F1EA; opacity: 0.5; }
    .sg-bottom-section .sg-card:hover .sg-card-arrow { color: #EA5C2B; opacity: 1; }

    .sg-footer-link {
        display: block;
        text-align: center;
        margin-top: 25px;
        font-size: 11px;
        color: rgba(244, 241, 234, 0.4);
        text-decoration: none;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 600;
        transition: color 0.3s ease;
    }

    .sg-footer-link:hover {
        color: #F4F1EA;
    }
</style>
</head>
<body>

        <div class="sg-transition-art">

                <path fill="#EA5C2B" d="M0,30 C300,80 450,0 750,40 C1050,80 1200,20 1440,50 L1440,80 L0,80 Z"></path>

        <div class="sg-bottom-section">

                <a href="https://max.ru/join/InKiY9p9ju7XuI8qxvNiOF-ZXTuoutH1UkvqJlgnVOE" class="sg-card" target="_blank">

</div>

</body>
</html>
